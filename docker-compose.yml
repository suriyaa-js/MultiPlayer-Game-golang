version: '3.8'  # You can adjust the version as needed
services:
  my-redis:
    image: redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=game_db  # Optional: set a default database
    volumes:
      - ./data/mongo:/data/db # Mount the local directory ./data/mongo to /data/db (default path where mongoDn store data) in the container

  myapp-2:
    build: .
    ports:
      - "9100:9100"
    environment:
      - SERVER_ADDRESS=localhost:9100
      - WRITE_TIMEOUT=15
      - READ_TIMEOUT=15
      - MONGO_DB_URL=mongodb://mongodb:27017  # Use the service name
      - MONGO_DB_NAME=game_db
      - MONGO_DB_COLLECTION=players
      - REDIS_URL=my-redis:6379
    depends_on:
      - my-redis
      - mongodb




